spring.application.name=fenixtech
server.servlet.context-path=/fenixtech/api/v1

spring.datasource.url=jdbc:mariadb://mariadb:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Reintenta la conexión si falla al arrancar
spring.datasource.hikari.initialization-fail-timeout=60000
# Tiempo de espera para obtener una conexión
spring.datasource.hikari.connection-timeout=30000